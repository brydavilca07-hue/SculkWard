name: Build SculkWard

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compilar
        run: mvn -B package
      - name: Subir el .jar
        uses: actions/upload-artifact@v4
        with:
          name: SculkWard
          path: target/SculkWard-*.jar
